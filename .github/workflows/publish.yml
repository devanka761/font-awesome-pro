name: Publish Font-Awesome-Pro

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish NPM Package"
        type: boolean
        required: true
        default: false
      tags:
        description: "Release Tag"
        type: boolean
        required: true
        default: false
      assets:
        description: "Create and Upload Assets"
        type: boolean
        required: true
        default: false
      svgs:
        description: "Create and Upload Downloaders"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      use_version: ${{ steps.check.outputs.use_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: check
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}

          echo "$LATEST_VERSION - $CURRENT_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "use_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "use_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          fi

  publish_npm:
    needs: setup
    if: inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: ./downloader
        run: npm ci

      - name: Build
        working-directory: ./downloader
        run: npm run create

      - name: Publish
        run: npm publish --provenance --access public --no-git-checks --tag latest

  create_svgs:
    needs: setup
    if: inputs.svgs == true
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ./downloader
        run: npm ci

      - name: Build
        working-directory: ./downloader
        run: npm run svg

      - name: Create Zip SVG Singles Normal
        run: |
          VERSION="${{ needs.setup.outputs.use_version }}"
          ZIP_NAME="fapro-singles-only-v$VERSION.zip"

          cd dist
          zip -r "../$ZIP_NAME" svgs/
          cd ..

      - name: Create Zip SVG Singles Full
        run: |
          VERSION="${{ needs.setup.outputs.use_version }}"
          ZIP_NAME="fapro-singles-only-full-v$VERSION.zip"

          cd dist
          zip -r "../$ZIP_NAME" svgs-full/
          cd ..

      - name: Create Zip Sprites
        run: |
          VERSION="${{ needs.setup.outputs.use_version }}"
          ZIP_NAME="fapro-sprites-only-v$VERSION.zip"

          cd dist
          zip -r "../$ZIP_NAME" sprites/
          cd ..

      - name: Upload Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: svgs-zip
          path: dist/

  tag_repo:
    needs: setup
    if: inputs.tags == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag release
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${{ needs.setup.outputs.use_version }}" -m "v${{ needs.setup.outputs.use_version }}"
          git push origin "v${{ needs.setup.outputs.use_version }}"

  create_release:
    needs: [setup, tag_repo, create_svgs]
    if: |
      always() && 
      inputs.assets == true && 
      needs.setup.result == 'success' && 
      (needs.tag_repo.result == 'success' || needs.tag_repo.result == 'skipped') &&
      (needs.create_svgs.result == 'success' || needs.create_svgs.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ./downloader
        run: npm ci

      - name: Build
        working-directory: ./downloader
        run: npm run create

      - name: Download Executables
        if: inputs.svgs == true
        uses: actions/download-artifact@v4
        with:
          name: svgs-zip
          path: dist/

      - name: Create Release & Upload Assets
        run: |
          VERSION="${{ needs.setup.outputs.use_version }}"
          ZIP_NAME="font-awesome-pro-v$VERSION.zip"
          TAG_NAME="v$VERSION"

          cd dist
          zip -r "../$ZIP_NAME" webfonts/ css/
          cd ..

          ASSETS=("$ZIP_NAME")

          if [ "${{ inputs.svgs }}" == "true" ]; then
            ASSETS+=("dist/fapro-singles-only-v$VERSION.zip")
            ASSETS+=("dist/fapro-singles-only-full-v$VERSION.zip")
            ASSETS+=("dist/fapro-sprites-only-v$VERSION.zip")
          fi

          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Release $TAG_NAME already exists. Overwriting asset..."
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            echo "Release $TAG_NAME does not exists. Creating new release..."
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "Release $TAG_NAME" \
              --generate-notes
          fi
