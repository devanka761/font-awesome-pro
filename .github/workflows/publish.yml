name: Publish Font-Awesome-Pro

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish NPM Package"
        type: boolean
        required: true
        default: false
      tags:
        description: "Release Tag"
        type: boolean
        required: true
        default: false
      assets:
        description: "Create and Upload Assets"
        type: boolean
        required: true
        default: false
      custom_tag:
        description: "Custom Tag for Release"
        type: string
        required: false
        default: ""

permissions:
  id-token: write
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      use_version: ${{ steps.check.outputs.use_version }}
      release_version: ${{ steps.check.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: check
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}

          echo "$LATEST_VERSION - $CURRENT_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "use_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            DEFAULT_RELEASE=$CURRENT_VERSION
          else
            echo "use_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
            DEFAULT_RELEASE=$LATEST_VERSION
          fi

          CUSTOM_TAG="${{ inputs.custom_tag }}"
          if [ -n "$CUSTOM_TAG" ]; then
            CLEAN_TAG=${CUSTOM_TAG#v}
            echo "release_version=$CLEAN_TAG" >> $GITHUB_OUTPUT
          else
            echo "release_version=$DEFAULT_RELEASE" >> $GITHUB_OUTPUT
          fi

  publish_npm:
    needs: setup
    if: inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: ./downloader
        run: npm ci

      - name: Build Project
        working-directory: ./downloader
        run: npm run build

      - name: Create releases file
        working-directory: ./downloader
        run: npm run create

      - name: Publish
        run: npm publish --provenance --access public --no-git-checks --tag latest

  tag_repo:
    needs: setup
    if: inputs.tags == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag release
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${{ needs.setup.outputs.use_version }}" -m "v${{ needs.setup.outputs.use_version }}"
          git push origin "v${{ needs.setup.outputs.use_version }}"

  create_release:
    needs: [setup, tag_repo]
    if: |
      always() && 
      inputs.assets == true && 
      needs.setup.result == 'success' && 
      (needs.tag_repo.result == 'success' || needs.tag_repo.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ./downloader
        run: npm ci

      - name: Build Project
        working-directory: ./downloader
        run: npm run build

      - name: Create releases file
        working-directory: ./downloader
        run: npm run create

      - name: Create Release & Upload Assets
        run: |
          VERSION="${{ needs.setup.outputs.release_version }}"
          ZIP_NAME="font-awesome-pro-v$VERSION.zip"
          TAG_NAME="v$VERSION"

          cd dist
          zip -r "../$ZIP_NAME" webfonts/ css/ js/
          cd ..

          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Release $TAG_NAME already exists. Overwriting asset..."
            gh release upload "$TAG_NAME" "$ZIP_NAME" --clobber
          else
            echo "Release $TAG_NAME does not exists. Creating new release..."
            gh release create "$TAG_NAME" "$ZIP_NAME" \
              --title "Font Awesome Pro+ $TAG_NAME"
          fi
